name: Build Kasim USB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build Kasim USB EXE
        run: pyinstaller --onefile --windowed --name "Kasim USB" kasim_usb.py

      - name: Upload Kasim USB EXE
        uses: actions/upload-artifact@v4
        with:
          name: Kasim-USB
          path: "dist/Kasim USB.exe"
